name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Types, build et tests de sécurité
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Valeurs factices : le build et les tests de sécurité ne doivent jamais
      # dépendre d'une vraie base ni de vrais secrets.
      DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/ci?sslmode=disable"
      AUTH_SECRET: "ci-only-insecure-secret-change-me-32-chars"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation des dépendances
        run: npm ci --no-audit --no-fund

      - name: Vérification des types
        run: npx tsc --noEmit

      - name: Build de production
        run: npm run build

      - name: Tests de non-régression sécurité
        run: npm run test:security
