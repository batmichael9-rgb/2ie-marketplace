<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <title>Hors ligne · 2iE Market</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #fafaf9;
        color: #1e293b;
        padding: 24px;
      }
      main {
        max-width: 26rem;
        text-align: center;
      }
      .logo {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        background: #0f766e;
        color: #fff;
        font-weight: 700;
        font-size: 20px;
      }
      h1 {
        font-size: 1.35rem;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 20px;
        color: #475569;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 999px;
        background: #0f766e;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">2iE</div>
      <h1>Pas de connexion</h1>
      <p>
        Tu es hors ligne. Vérifie ton réseau : les pages déjà visitées restent disponibles, le reste
        revient dès que la connexion est rétablie.
      </p>
      <a href="/">Réessayer</a>
    </main>
  </body>
</html>
